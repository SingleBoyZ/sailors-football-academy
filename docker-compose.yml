services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: sailors
      POSTGRES_PASSWORD: sailors
      POSTGRES_DB: sailors_fa
    ports:
      - "5432:5432"
    volumes:
      - sailors_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sailors -d sailors_fa"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  sailors_pgdata:
