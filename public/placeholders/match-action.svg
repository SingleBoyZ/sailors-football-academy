<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-label="MATCH DAY placeholder photo">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f0f10" />
      <stop offset="1" stop-color="#2a2a2c" />
    </linearGradient>
    <pattern id="stripes" width="80" height="80" patternTransform="rotate(115)" patternUnits="userSpaceOnUse">
      <rect width="80" height="80" fill="transparent" />
      <rect width="28" height="80" fill="#e8232a" opacity="0.18" />
    </pattern>
  </defs>
  <rect width="1200" height="900" fill="url(#g)" />
  <rect width="1200" height="900" fill="url(#stripes)" />
  <text x="600" y="440" font-family="Arial, sans-serif" font-weight="800" font-size="75" fill="#f7f5f2" text-anchor="middle" letter-spacing="2">MATCH DAY</text>
  <text x="600" y="505" font-family="Arial, sans-serif" font-weight="500" font-size="30" fill="#e8232a" text-anchor="middle" letter-spacing="4">IN-GAME ACTION PHOTO</text>
</svg>